<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>책 읽은 사람만 열 수 있는 비밀 금고</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    color: #1e293b;
  }
  .card {
    width: min(92%, 460px);
    background: white;
    border-radius: 28px;
    padding: 38px 30px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(15, 23, 42, .12);
  }
  .lock { font-size: 64px; margin-bottom: 10px; }
  h1 { margin: 0 0 10px; font-size: 27px; }
  p { margin: 0 0 25px; color: #64748b; line-height: 1.6; }
  input {
    width: 100%;
    padding: 17px 14px;
    border: 2px solid #cbd5e1;
    border-radius: 15px;
    font-size: 24px;
    text-align: center;
    letter-spacing: 5px;
    outline: none;
  }
  input:focus { border-color: #6366f1; }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 16px;
    border: 0;
    border-radius: 15px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    background: #4f46e5;
    color: white;
  }
  button:hover { background: #4338ca; }
  .message {
    min-height: 70px;
    margin-top: 22px;
    padding: 16px;
    border-radius: 15px;
    display: none;
    font-weight: 700;
    line-height: 1.5;
  }
  .wrong { display: block; background: #fef2f2; color: #b91c1c; }
  .right { display: block; background: #f0fdf4; color: #15803d; }
  .small { margin-top: 20px; font-size: 13px; color: #94a3b8; }
</style>
</head>
<body>
  <main class="card">
    <div class="lock" id="lock">🔐</div>
    <h1>책 읽은 사람만 열 수 있는<br>비밀 금고</h1>
    <p>10개의 단서를 모두 찾았다면<br>최종 비밀번호를 입력하세요.</p>

    <input id="password" inputmode="numeric" maxlength="10"
           placeholder="□□□□ □□□□□" aria-label="비밀번호">
    <button onclick="checkPassword()">🔓 비밀번호 확인</button>

    <div id="message" class="message"></div>
    <div class="small">힌트가 필요하다면 책 속 단서를 다시 확인해 보세요.</div>
  </main>

<script>
function checkPassword() {
  const input = document.getElementById("password");
  const message = document.getElementById("message");
  const lock = document.getElementById("lock");
  const value = input.value.replace(/\s/g, "");

  message.className = "message";

  if (value === "3719428560") {
    lock.textContent = "🎉";
    message.className = "message right";
    message.innerHTML = "🔓 잠금 해제 성공!<br>당신은 이 책의 진짜 독자입니다!";
    input.disabled = true;
  } else {
    lock.textContent = "🔒";
    message.className = "message wrong";
    message.innerHTML = "❌ 비밀번호가 아닙니다.<br>책 속 단서를 다시 확인해 보세요!";
    input.select();
  }
}

document.getElementById("password").addEventListener("keydown", function(e) {
  if (e.key === "Enter") checkPassword();
});
</script>
</body>
</html>
